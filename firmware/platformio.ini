; Affective Core AC-7 — Companion Systems Inc.
; Target: ESP32-C6-Supermini

[env:affective-core]
platform    = espressif32
board       = esp32-c6-devkitc-1
framework   = arduino

; 160 MHz is the reliable default for C6; 80 MHz if thermals matter
board_build.f_cpu = 160000000L

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11

build_flags =
    -DCORE_DEBUG_LEVEL=0
